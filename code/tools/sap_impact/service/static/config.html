<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탭 설정</title>
<script src="https://res.cdn.office.net/teams-js/2.24.0/js/MicrosoftTeams.min.js"
        crossorigin="anonymous"></script>
<style>
  body { font: 14px/1.6 "Segoe UI", "Malgun Gothic", sans-serif; padding: 20px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  select, input { width: 100%; max-width: 420px; padding: 7px; }
  .muted { color: #616161; font-size: 12px; }
</style>
</head>
<body>
<h2>SAP 변경 영향 분석 탭 추가</h2>
<p class="muted">이 채널에서 기본으로 사용할 코드베이스를 선택하세요.</p>
<label for="ws">코드베이스</label>
<select id="ws"></select>
<script>
(async () => {
  await microsoftTeams.app.initialize();
  const sel = document.getElementById("ws");
  try {
    const list = await (await fetch("../workspaces")).json();
    sel.innerHTML = list.map(w => `<option value="${w.id}">${w.id}</option>`).join("");
  } catch (e) {
    sel.innerHTML = '<option value="">(기본)</option>';
  }
  const save = () => {
    microsoftTeams.pages.config.setConfig({
      entityId: "sapImpact",
      contentUrl: location.origin + location.pathname.replace(/config\.html$/, "tab.html")
                  + "?workspace=" + encodeURIComponent(sel.value),
      suggestedDisplayName: "SAP 영향 분석",
    });
    microsoftTeams.pages.config.setValidityState(true);
  };
  sel.onchange = save;
  save();
  microsoftTeams.pages.config.registerOnSaveHandler(evt => evt.notifySuccess());
})();
</script>
</body>
</html>
