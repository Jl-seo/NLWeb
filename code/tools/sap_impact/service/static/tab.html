<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP 변경 영향 분석</title>
<script src="https://res.cdn.office.net/teams-js/2.24.0/js/MicrosoftTeams.min.js"
        crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #242424; --subtle: #616161; --line: #e0e0e0;
    --accent: #5b5fc7; --card: #faf9f8; --good: #0e700e; --warn: #bc4b09; --bad: #c4314b;
  }
  body.theme-dark {
    --bg: #1f1f1f; --fg: #ffffff; --subtle: #adadad; --line: #3d3d3d;
    --accent: #7f85f5; --card: #2b2b2b; --good: #54b054; --warn: #e6a44e; --bad: #e37d8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--subtle); font-size: 12px; margin-bottom: 16px; }
  .modes { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .modes button { background: none; border: 1px solid var(--line); color: var(--fg);
                  padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .modes button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .query { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  input, select { background: var(--bg); color: var(--fg); border: 1px solid var(--line);
                  border-radius: 4px; padding: 7px 9px; font-size: 13px; }
  input[type=text] { flex: 1; min-width: 240px; }
  .go { background: var(--accent); color: #fff; border: none; border-radius: 4px;
        padding: 8px 18px; cursor: pointer; font-size: 13px; }
  .hint { color: var(--subtle); font-size: 12px; margin-bottom: 16px; }
  .panel { border: 1px solid var(--line); border-radius: 6px; padding: 14px;
           margin-bottom: 14px; background: var(--card); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-weight: 600;
           font-size: 12px; color: #fff; }
  .LOW { background: var(--good); } .MEDIUM { background: var(--warn); }
  .HIGH, .CRITICAL { background: var(--bad); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px;
         flex-wrap: wrap; }
  ul { margin: 8px 0 0; padding-left: 20px; }
  li { margin-bottom: 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; border-bottom: 2px solid var(--line); padding: 7px 6px;
       cursor: pointer; user-select: none; white-space: nowrap; }
  th .arrow { color: var(--subtle); font-size: 10px; }
  td { border-bottom: 1px solid var(--line); padding: 7px 6px; vertical-align: top; }
  code { font-family: Consolas, "Courier New", monospace; font-size: 12px;
         background: rgba(127,127,127,.15); padding: 1px 4px; border-radius: 3px;
         word-break: break-all; }
  .path { color: var(--subtle); font-size: 11px; }
  .filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .checklist li { list-style: none; margin-bottom: 6px; }
  .checklist { padding-left: 0; }
  .checklist label { cursor: pointer; }
  .checklist input { margin-right: 8px; }
  .done { color: var(--subtle); text-decoration: line-through; }
  .warnbox { border-left: 4px solid var(--warn); }
  .err { color: var(--bad); }
  .muted { color: var(--subtle); }
  .tools { display: flex; gap: 8px; }
  .tools button { background: none; border: 1px solid var(--line); color: var(--fg);
                  border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<h1>SAP 변경 영향 분석</h1>
<div class="sub">참조 그래프 기반 · 모든 항목에 파일·라인 근거 포함 · 동적 호출은 사각지대로 별도 표기</div>

<div class="modes">
  <button data-mode="impact" class="on">오브젝트 변경</button>
  <button data-mode="ask">업무 용어로 찾기</button>
  <button data-mode="changes">수정내역(git)</button>
</div>

<div class="query">
  <input type="text" id="q" placeholder="예: ZORDER_HDR, ZCL_ORDER_SERVICE (쉼표 구분)">
  <select id="hops">
    <option value="2">2홉</option><option value="3" selected>3홉</option>
    <option value="4">4홉</option><option value="5">5홉</option>
  </select>
  <select id="workspace"></select>
  <button class="go" id="go">분석</button>
</div>
<div class="hint" id="hint">변경한 오브젝트명을 입력하세요. 쉼표로 여러 개 지정할 수 있습니다.</div>

<div id="out"></div>

<script>
const state = { mode: "impact", report: null, sort: { key: "hops", asc: true }, workspaces: [] };
const HINTS = {
  impact: "변경한 오브젝트명을 입력하세요. 쉼표로 여러 개 지정할 수 있습니다.",
  ask: "업무 용어로 질문하세요. 예: 구매요청 승인 로직 고치면 뭐가 영향받아?",
  changes: "git 리비전 범위를 입력하세요. 예: HEAD~1, main..feature. 비우면 작업 트리 기준입니다.",
};
const PLACEHOLDER = {
  impact: "예: ZORDER_HDR, ZCL_ORDER_SERVICE (쉼표 구분)",
  ask: "예: 구매요청 승인 로직 고치면 뭐가 영향받아?",
  changes: "예: main..feature (비우면 작업 트리)",
};

/* Teams가 아닌 브라우저에서도 그대로 동작해야 한다: SDK는 있으면 쓰고 없으면 무시한다. */
async function initTeams() {
  if (!window.microsoftTeams) return;
  try {
    await microsoftTeams.app.initialize();
    const ctx = await microsoftTeams.app.getContext();
    applyTheme(ctx.app.theme);
    microsoftTeams.app.registerOnThemeChangeHandler(applyTheme);
    const sub = ctx.page && ctx.page.subPageId;
    if (sub) applyQuery(JSON.parse(sub));
  } catch (e) { /* 브라우저 단독 실행 */ }
}
function applyTheme(theme) {
  document.body.classList.toggle("theme-dark", theme === "dark" || theme === "contrast");
}
function applyQuery(q) {
  if (!q) return;
  if (q.mode) setMode(q.mode);
  if (q.objects) document.getElementById("q").value = q.objects.join(", ");
  if (q.prompt) document.getElementById("q").value = q.prompt;
  if (q.hops) document.getElementById("hops").value = String(q.hops);
  run();
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll(".modes button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === mode));
  document.getElementById("hint").textContent = HINTS[mode];
  document.getElementById("q").placeholder = PLACEHOLDER[mode];
}
document.querySelectorAll(".modes button").forEach(b =>
  b.onclick = () => setMode(b.dataset.mode));
document.getElementById("go").onclick = run;
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") run(); });

async function api(path, options) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } },
                                              options || {}));
  const data = await res.json().catch(() => ({ detail: res.statusText }));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

async function loadWorkspaces() {
  try {
    state.workspaces = await api("../workspaces");
  } catch (e) { state.workspaces = []; }
  const sel = document.getElementById("workspace");
  sel.innerHTML = state.workspaces.map(w =>
    `<option value="${w.id}">${w.id}${w.ready ? "" : " (인덱싱 중)"}</option>`).join("");
  sel.style.display = state.workspaces.length > 1 ? "" : "none";
}

async function run() {
  const value = document.getElementById("q").value.trim();
  const hops = Number(document.getElementById("hops").value);
  const workspace = document.getElementById("workspace").value || null;
  const out = document.getElementById("out");
  out.innerHTML = '<div class="panel muted">분석 중...</div>';
  try {
    let report;
    if (state.mode === "impact") {
      if (!value) throw new Error("오브젝트명을 입력하세요.");
      report = await api("../impact", { method: "POST", body: JSON.stringify(
        { objects: value.split(",").map(s => s.trim()).filter(Boolean), hops, workspace }) });
    } else if (state.mode === "ask") {
      if (!value) throw new Error("질문을 입력하세요.");
      report = await api("../ask", { method: "POST", body: JSON.stringify(
        { prompt: value, hops, workspace, select: 2 }) });
    } else {
      report = await api("../changes", { method: "POST", body: JSON.stringify(
        { revision_range: value || null, hops, workspace }) });
    }
    state.report = report;
    render();
  } catch (e) {
    out.innerHTML = `<div class="panel err">오류: ${escapeHtml(e.message)}</div>`;
  }
}

function render() {
  const r = state.report;
  const out = document.getElementById("out");
  const parts = [];

  parts.push(`<div class="panel">
    <div class="row">
      <div><strong>변경 오브젝트</strong> ${r.changed_objects.map(tag).join(" ") || "(없음)"}</div>
      <div><span class="badge ${r.severity}">위험도 ${r.severity}</span></div>
    </div>
    ${r.not_found.length ? `<div class="muted">코드베이스에서 못 찾음: ${r.not_found.join(", ")}</div>` : ""}
    <ul>${r.severity_reasons.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>
  </div>`);

  if (r.resolved_from_prompt && r.resolved_from_prompt.length) {
    parts.push(`<div class="panel"><strong>대상 선택 근거</strong><ul>${
      r.resolved_from_prompt.map(c =>
        `<li>${tag(c.object_key)} <span class="muted">${escapeHtml(c.matched_because)} (점수 ${c.score})</span></li>`
      ).join("")}</ul></div>`);
  }

  if (r.changed_files && r.changed_files.length) {
    parts.push(`<div class="panel"><strong>수정된 파일 ${r.changed_files.length}건</strong><ul>${
      r.changed_files.slice(0, 30).map(f =>
        `<li>${escapeHtml(f.status)} <code>${escapeHtml(f.path)}</code></li>`).join("")}</ul></div>`);
  }

  parts.push(impactTable(r));

  if (r.external_contracts.length) {
    parts.push(`<div class="panel warnbox"><strong>외부 계약 도달</strong>
      <div class="muted">연계 시스템·사용자 화면에 영향이 도달합니다. 이행 시 통보 대상입니다.</div>
      <ul>${r.external_contracts.map(x => `<li>${tag(x)}</li>`).join("")}</ul></div>`);
  }

  if (r.regression_scope.length) parts.push(checklist(r));

  if (r.blind_spots.length) {
    parts.push(`<div class="panel warnbox"><strong>정적 분석 사각지대 ${r.blind_spots.length}건</strong>
      <div class="muted">동적 호출은 코드만으로 추적할 수 없습니다. 아래 지점은 담당자 확인이 필요합니다.</div>
      <ul>${r.blind_spots.map(b =>
        `<li>${tag(b.object_key)} <code>${escapeHtml(b.file)}:${b.line}</code> ${escapeHtml(b.reason)}</li>`
      ).join("")}</ul></div>`);
  }

  out.innerHTML = parts.join("");
  bindTable();
}

function impactTable(r) {
  const types = [...new Set(r.impacted.map(i => i.object_type_label))].sort();
  return `<div class="panel">
    <div class="row">
      <strong>영향 오브젝트 ${r.impacted_count}건${r.truncated ? " (표시 " + r.impacted.length + "건으로 잘림)" : ""}</strong>
      <div class="tools"><button id="csv">CSV 내보내기</button></div>
    </div>
    <div class="filters">
      <input type="text" id="ftext" placeholder="오브젝트·근거 검색">
      <select id="ftype"><option value="">전체 타입</option>${
        types.map(t => `<option>${escapeHtml(t)}</option>`).join("")}</select>
      <select id="fhops"><option value="">전체 홉</option>${
        [1,2,3,4,5].map(h => `<option value="${h}">${h}홉 이내</option>`).join("")}</select>
    </div>
    <div class="scroll"><table id="tbl">
      <thead><tr>
        <th data-k="hops">홉<span class="arrow"></span></th>
        <th data-k="object_key">오브젝트<span class="arrow"></span></th>
        <th data-k="object_type_label">타입<span class="arrow"></span></th>
        <th data-k="evidence">근거<span class="arrow"></span></th>
      </tr></thead>
      <tbody></tbody>
    </table></div>
  </div>`;
}

function bindTable() {
  if (!state.report) return;
  const tbl = document.getElementById("tbl");
  if (!tbl) return;
  const draw = () => {
    const text = (document.getElementById("ftext").value || "").toLowerCase();
    const type = document.getElementById("ftype").value;
    const hops = document.getElementById("fhops").value;
    let rows = state.report.impacted.filter(i =>
      (!type || i.object_type_label === type) &&
      (!hops || i.hops <= Number(hops)) &&
      (!text || (i.object_key + i.description + i.evidence.statement + i.evidence.file)
        .toLowerCase().includes(text)));
    const { key, asc } = state.sort;
    rows = rows.slice().sort((a, b) => {
      const av = key === "evidence" ? a.evidence.file : a[key];
      const bv = key === "evidence" ? b.evidence.file : b[key];
      return (av > bv ? 1 : av < bv ? -1 : 0) * (asc ? 1 : -1);
    });
    tbl.querySelector("tbody").innerHTML = rows.map(i => `<tr>
      <td>${i.hops}</td>
      <td><strong>${escapeHtml(i.object_key)}</strong>
          ${i.description ? `<div class="path">${escapeHtml(i.description)}</div>` : ""}
          <div class="path">${i.path.map(escapeHtml).join(" → ")}</div></td>
      <td>${escapeHtml(i.object_type_label)}</td>
      <td><code>${escapeHtml(i.evidence.file)}:${i.evidence.line}</code>
          <div class="path">${escapeHtml(i.evidence.reference_kind)}</div>
          <div><code>${escapeHtml((i.evidence.statement || "").slice(0, 160))}</code></div></td>
    </tr>`).join("") || `<tr><td colspan="4" class="muted">조건에 맞는 항목이 없습니다.</td></tr>`;
    tbl.querySelectorAll("th").forEach(th => {
      th.querySelector(".arrow").textContent = th.dataset.k === key ? (asc ? " ▲" : " ▼") : "";
    });
  };
  tbl.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    state.sort = { key: k, asc: state.sort.key === k ? !state.sort.asc : true };
    draw();
  });
  ["ftext", "ftype", "fhops"].forEach(id => {
    const el = document.getElementById(id);
    el.oninput = draw; el.onchange = draw;
  });
  document.getElementById("csv").onclick = exportCsv;
  draw();
}

function checklist(r) {
  const key = "sapimpact:" + (r.workspace || "") + ":" + r.changed_objects.join(",");
  const saved = JSON.parse(localStorage.getItem(key) || "[]");
  setTimeout(() => {
    document.querySelectorAll(".checklist input").forEach((box, idx) => {
      box.checked = saved.includes(idx);
      box.parentElement.classList.toggle("done", box.checked);
      box.onchange = () => {
        const now = [...document.querySelectorAll(".checklist input")]
          .map((b, i) => b.checked ? i : -1).filter(i => i >= 0);
        localStorage.setItem(key, JSON.stringify(now));
        box.parentElement.classList.toggle("done", box.checked);
      };
    });
  }, 0);
  return `<div class="panel"><strong>회귀 테스트 범위 ${r.regression_scope.length}건</strong>
    <div class="muted">실행 가능한 단위입니다. 체크 상태는 이 브라우저에 저장됩니다.</div>
    <ul class="checklist">${r.regression_scope.map(s =>
      `<li><label><input type="checkbox">${escapeHtml(s)}</label></li>`).join("")}</ul></div>`;
}

function exportCsv() {
  const r = state.report;
  const head = ["홉", "오브젝트", "타입", "설명", "참조경로", "근거파일", "근거라인", "참조종류", "근거구문"];
  const rows = r.impacted.map(i => [i.hops, i.object_key, i.object_type_label, i.description,
    i.path.join(" > "), i.evidence.file, i.evidence.line, i.evidence.reference_kind,
    i.evidence.statement]);
  const csv = [head, ...rows].map(cols => cols.map(c =>
    `"${String(c === null || c === undefined ? "" : c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  // BOM: Excel이 UTF-8 한글을 올바르게 읽게 한다.
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `sap-impact-${(r.changed_objects[0] || "result").replace(/[^\w]/g, "_")}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function tag(key) { return `<code>${escapeHtml(key)}</code>`; }
function escapeHtml(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

initTeams();
loadWorkspaces();
const params = new URLSearchParams(location.search);
if (params.get("q")) { try { applyQuery(JSON.parse(params.get("q"))); } catch (e) {} }
</script>
</body>
</html>
